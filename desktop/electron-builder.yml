appId: io.pdfpal.desktop
productName: pdfpal
executableName: pdfpal
electronVersion: 45.1.0
copyright: Copyright © 2026 pdfpal contributors
asar: true
beforePack: build/prepare-cli.cjs
asarUnpack:
  - '**/*.node'
directories:
  app: stage
  output: artifacts
  buildResources: build
files:
  - '**/*'
  - '!test/**'
  - '!discovery.test.mjs'
  - '!cli-bin/**'
extraResources:
  - from: stage/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: build/LICENSE.txt
    to: LICENSE.pdfpal.txt
win:
  extraFiles:
    - from: stage/cli-bin
      to: bin
  target: nsis
  icon: build/icon.ico
  signAndEditExecutable: true
  signExecutable: false
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: pdfpal-Setup-${version}-${arch}.exe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: pdfpal
  uninstallDisplayName: pdfpal
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  differentialPackage: false
  include: build/installer.nsh
  license: build/LICENSE.txt
  installerLanguages:
    - en_US
linux:
  target:
    - dir
    - deb
  executableName: pdfpal-desktop
  syncDesktopName: true
  artifactName: pdfpal-${version}-${arch}.${ext}
  category: Office
  synopsis: Local-first PDF and Kindle reading assistant
  icon: build/icon.png
  maintainer: pdfpal contributors
  desktop:
    entry:
      Keywords: PDF;Reader;Kindle;
  extraFiles:
    - from: stage/cli-bin
      to: bin
# Native dependencies are installed only inside the isolated desktop stage.
npmRebuild: false
publish: null
