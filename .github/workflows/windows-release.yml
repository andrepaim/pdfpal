# Publishes one desktop-v<version> GitHub release with the Windows installer and
# the Mac disk image. The workflow keeps its historical file name and title.
# Publication waits for the Linux regression, the Windows build and the Mac
# build; if either platform fails, nothing is published (docs/windows-release-pipeline.md).
name: Publish Windows desktop release

on:
  push:
    branches: [master]
    paths: ['desktop/version.json']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'desktop/scripts/desktop-release.mjs'
      - 'desktop/test/release.test.mjs'
      - 'desktop/src/updates.mjs'
      - 'desktop/test/updates.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test desktop/test/release.test.mjs desktop/test/updates.test.mjs

  plan:
    if: github.event_name != 'pull_request' && github.repository == 'andrepaim/pdfpal' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          node scripts/check-secrets.mjs
          node desktop/scripts/desktop-release.mjs plan

  regression:
    needs: plan
    if: always() && (github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Verify Firebase sync against emulators
        run: npm exec --yes --package=firebase-tools@15.5.1 -- firebase --config cloud/firebase.json emulators:exec --only firestore,storage --project demo-pdfpal-sync 'node --import tsx --test test/integration/cloud-firestore.test.ts'
      - run: npm --prefix desktop test
      - run: npm exec --workspace frontend -- playwright install --with-deps chromium
      - run: npm exec --workspace frontend -- playwright test
      - run: npm exec --workspace extension -- playwright install --with-deps chromium
      - run: npm exec --workspace extension -- playwright test
      - run: npm run test:archive
      - run: npm run test:package

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    environment: ${{ needs.plan.outputs.channel == 'stable' && 'windows-release' || 'windows-preview' }}
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      PDFPAL_PUBLISHER_NAME: ${{ vars.PDFPAL_PUBLISHER_NAME }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require signing credentials for a stable release
        if: needs.plan.outputs.channel == 'stable'
        run: node --input-type=module -e "import {signingConfiguration} from './desktop/scripts/build-installer.mjs'; signingConfiguration(true)"
      - run: npm ci
      - run: node desktop/scripts/stage.mjs
      - name: Build and test installer
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          $signed = $env:RELEASE_CHANNEL -eq 'stable'
          ./desktop/scripts/windows-m3.ps1 -SourceRoot $env:GITHUB_WORKSPACE -WorkRoot "$env:RUNNER_TEMP/pdfpal-desktop-release" -Signed:$signed
      - name: Verify publication files
        shell: pwsh
        run: node desktop/scripts/desktop-release.mjs prepare "$env:RUNNER_TEMP/pdfpal-desktop-release/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-files
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/pdfpal-desktop-release/artifacts/pdfpal-Setup-*.exe
            ${{ runner.temp }}/pdfpal-desktop-release/artifacts/pdfpal-desktop-release.json
            ${{ runner.temp }}/pdfpal-desktop-release/artifacts/SHA256SUMS.txt
            ${{ runner.temp }}/pdfpal-desktop-release/artifacts/release-plan.json
            ${{ runner.temp }}/pdfpal-desktop-release/artifacts/release-notes.md

  # Experimental: the Mac build has not yet been confirmed on a real Mac.
  # Preview (suffixed) versions only: Mac builds are ad-hoc signed and not
  # notarized, so a stable version stops here until Mac signing exists.
  build-mac:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Refuse a stable Mac release until Mac signing exists
        if: needs.plan.outputs.channel == 'stable'
        run: |
          echo "::error::Stable desktop releases need a signed and notarized Mac build, which is not set up yet. Publish a suffixed preview version instead."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node desktop/scripts/stage.mjs
      - name: Build and test the Mac disk image
        run: node desktop/scripts/mac-build.mjs "--work=$RUNNER_TEMP/pdfpal-mac-release"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-files-mac
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/pdfpal-mac-release/artifacts/pdfpal-*-arm64.dmg
            ${{ runner.temp }}/pdfpal-mac-release/artifacts/pdfpal-desktop-release-darwin-arm64.json

  publish:
    needs: [plan, regression, build, build-mac]
    if: needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-publish-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-files
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-files-mac
          path: release-files
      # --require-mac refuses to publish unless the Mac disk image and its
      # manifest are present and verified. To publish a Windows-only release
      # on purpose, remove it, the Mac download step above and build-mac from
      # needs (docs/windows-release-pipeline.md, "Turning the Mac requirement off").
      - name: Publish tested Windows and Mac files to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node desktop/scripts/desktop-release.mjs publish release-files --require-mac
